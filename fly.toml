# fly launch --no-deploy  (then: fly volumes create royalweb_data --size 3)
app = "royalweb-autopilot"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  ROYALWEB_DATA_DIR = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "royalweb_data"
  destination = "/app/data"
